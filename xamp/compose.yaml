services:
  web:
    build: .
    ports:
      - 8080:80
    volumes:
      - ./htdocs:/var/www/html
    depends_on:
      - db
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ITE444
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - 3306:3306 # only needed if you connect from HeidiSQL/DBeaver
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
volumes:
  dbdata: null